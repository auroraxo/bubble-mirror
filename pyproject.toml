[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bubble-mirror"
version = "0.1.0"
description = "Free static mirror of a public Bubble app — no account, no install."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Aurora", email = "aurora@codebyaurora.com" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
playwright = ["playwright>=1.40"]
test = ["pytest>=7"]

[project.scripts]
bubble-mirror = "bubble_mirror.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bubble_mirror = ["py.typed"]
